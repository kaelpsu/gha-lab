name: 01 - Olá

on:
  push:
  workflow_dispatch:

jobs:
  saudacao:
    runs-on: ubuntu-latest
    steps:
      - name: Saudacao ao usuário
        run: echo "Olá ${{ github.actor }}! Evento:${{ github.event_name }}"

      - name: Informações do Sistema
        run: |
          echo "SO do runner: $RUNNER_OS"
          uname -a
          python3 --version
          ls -la
